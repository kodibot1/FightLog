<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0C0C0E">
<title>FightLog</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<style>
:root {
  /* Backgrounds */
  --bg: #0C0C0E;
  --surface: #161618;
  --surface2: #1C1C1F;
  --surface3: #242427;
  --border: #2A2A2E;
  /* Compat aliases */
  --card: var(--surface); --card2: var(--surface2); --card3: var(--surface3);
  /* Text */
  --text: #E8E8ED;
  --text2: #7C7C86;
  --text3: #4A4A52;
  /* Accent — muted amber */
  --accent: #C4956A;
  --accent-dim: rgba(196,149,106,0.08);
  --accent-border: rgba(196,149,106,0.30);
  /* Compat aliases */
  --orange: var(--accent); --purple: var(--accent);
  /* Semantic — desaturated */
  --red: #B35454;
  --green: #5A9E6F;
  --positive: #5A9E6F;
  --positive-dim: rgba(90,158,111,0.08);
  --negative: #B35454;
  --negative-dim: rgba(179,84,84,0.08);
  --caution: #B89A5A;
  --blue: #5A8AB5;
  --yellow: #B89A5A;
  --tab-h: 64px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; overflow-x:hidden; }
button { font-family:inherit; }

/* ── Tab Bar ── */
.tab-bar {
  position:fixed; bottom:0; left:0; right:0; height:var(--tab-h);
  background:var(--surface); border-top:1px solid var(--border); display:flex; z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--text3); font-size:10px; cursor:pointer;
  padding-top:8px; transition:color 0.15s ease; }
.tab.active { color:var(--accent); }
.tab .tab-icon { font-size:20px; }

/* ── Page Container ── */
.page { padding:0 0 calc(var(--tab-h) + 10px) 0; display:none; min-height:100dvh; }
.page.active { display:block; }
.page-header { padding:56px 16px 12px; position:sticky; top:0; background:var(--bg); z-index:10; }
.page-header h1 { font-size:28px; font-weight:700; }
.page-header .subtitle { font-size:13px; font-weight:500; color:var(--text2); margin-top:2px; }
.page-content { padding:0 16px 20px; }

/* ── Common ── */
.btn { border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.15s ease; }
.btn:disabled { opacity:0.4; cursor:default; }
.btn:active { transform:scale(0.97); opacity:0.85; }
.chip:active, .type-btn:active, .dur-btn:active, .int-btn:active,
.spar-btn:active, .ob-card:active, .ob-drill-btn:active { transform:scale(0.97); }
.session-row:active, .quick-card:active, .tech-row:active { transform:scale(0.98); opacity:0.8; }
.tab:active { opacity:0.6; }
.btn-primary, .btn-orange, .btn-green, .btn-purple { background:var(--accent); color:#0C0C0E; }
.btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-red { background:var(--negative-dim); color:var(--negative); border:1px solid rgba(179,84,84,0.25); }
.btn-ghost { background:none; color:var(--accent); }
.btn-card { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-full { width:100%; height:48px; }
.btn-sm { height:36px; padding:0 14px; font-size:14px; border-radius:10px; }

.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:6px 12px; border-radius:8px; font-size:14px; border:1px solid transparent; cursor:pointer;
  transition:all 0.15s ease; white-space:nowrap; background:var(--surface3); color:var(--text); }
.chip.selected { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-border); }
.chip.combo-sel { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-border); }

.section { margin-bottom:24px; }
.section-title { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase;
  letter-spacing:0.06em; margin-bottom:10px; margin-top:20px; }
.section-title:first-child { margin-top:0; }

.card { background:var(--surface); border-radius:12px; padding:16px; margin-bottom:10px; border:1px solid var(--border); }
.empty-state { text-align:center; padding:48px 20px; color:var(--text3); }
.empty-state .empty-icon { font-size:32px; margin-bottom:16px; display:block; opacity:0.6; }
.empty-state p { font-size:14px; line-height:1.5; }
.empty-state .empty-cta { font-size:13px; color:var(--text3); margin-top:4px; }

.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200;
  display:none; align-items:flex-end; justify-content:center; }
.modal-bg.show { display:flex; }
.modal { background:var(--surface); border-radius:16px 16px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,20px));
  width:100%; max-width:500px; max-height:90dvh; overflow-y:auto; }
.modal::before { content:''; display:block; width:36px; height:4px; background:var(--surface3);
  border-radius:9999px; margin:0 auto 16px; }
.modal h2 { font-size:20px; font-weight:600; margin-bottom:16px; }

input[type=text], input[type=number], input[type=password], textarea, select {
  width:100%; padding:12px 16px; background:var(--surface2); border:1px solid var(--border); border-radius:12px;
  color:var(--text); font-size:15px; font-family:inherit; transition:border-color 0.15s ease; }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
input::placeholder, textarea::placeholder { color:var(--text3); }
textarea { resize:vertical; min-height:80px; }
select { appearance:none; }

.row { display:flex; align-items:center; gap:12px; }
.spacer { flex:1; }

/* ── Dashboard ── */
.dash-btns { display:flex; gap:10px; margin-bottom:20px; }
.dash-log-btn { flex:1; height:48px; border-radius:12px; font-size:15px; }
.dash-mic-btn { width:48px; height:48px; border-radius:12px; font-size:20px; }
.quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.quick-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; height:64px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  cursor:pointer; color:var(--text); transition:all 0.15s ease; }
.quick-card .qc-icon { font-size:20px; }
.quick-card .qc-label { font-size:12px; color:var(--text2); }

.stat-row { display:flex; gap:10px; margin-bottom:20px; }
.stat-card { flex:1; background:var(--surface); border:none; border-radius:12px; padding:16px; text-align:center; }
.stat-card .stat-val { font-size:22px; font-weight:700; color:var(--accent); }
.stat-card .stat-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text2); margin-top:2px; }

.session-row { display:flex; align-items:center; gap:12px; padding:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px;
  cursor:pointer; transition:all 0.15s ease; }
.session-icon { width:42px; height:42px; background:var(--accent-dim); border-radius:10px;
  display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.session-info { flex:1; }
.session-type { font-weight:600; font-size:15px; }
.session-meta { font-size:13px; color:var(--text2); margin-top:2px; }
.session-date { font-size:12px; color:var(--text3); }

.session-list { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.session-list .session-row { background:none; border:none; border-radius:0; margin-bottom:0;
  border-bottom:1px solid var(--border); }
.session-list .session-row:last-child { border-bottom:none; }
.session-list .list-footer { text-align:center; padding:12px; }
.session-list .list-footer button { font-size:14px; font-weight:600; }

.hero-stat { text-align:center; padding:24px 0; }
.hero-stat .hero-val { font-size:48px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; line-height:1; }
.hero-stat .hero-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text2); margin-top:6px; }
.hero-stat .hero-secondary { font-size:15px; color:var(--text2); margin-top:8px; }

.welcome-card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:20px; margin-bottom:20px; }
.welcome-card h3 { font-size:16px; font-weight:700; margin-bottom:12px; }
.welcome-card .wc-method { display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
.welcome-card .wc-icon { font-size:24px; flex-shrink:0; margin-top:2px; }
.welcome-card .wc-title { font-size:14px; font-weight:600; margin-bottom:2px; }
.welcome-card .wc-desc { font-size:13px; color:var(--text2); line-height:1.4; }
.welcome-card .wc-dismiss { font-size:13px; color:var(--text3); margin-top:4px; }

/* ── Quick Log ── */
.type-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.type-btn { height:64px; border-radius:12px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px; background:var(--surface);
  color:var(--text); border:1px solid var(--border); cursor:pointer; font-size:13px;
  font-weight:500; position:relative; transition:all 0.15s ease; }
.type-btn .t-icon { font-size:18px; }
.type-btn.selected { border-color:var(--accent-border); background:var(--accent-dim); }

.dur-row { display:flex; gap:8px; }
.dur-btn { flex:1; height:38px; border-radius:9999px; border:1px solid var(--border); cursor:pointer;
  background:var(--surface); color:var(--text); font-weight:600; font-size:14px; transition:all 0.15s ease; }
.dur-btn.selected { border-color:var(--accent-border); background:var(--accent-dim); color:var(--accent); }

.int-row { display:flex; gap:8px; }
.int-btn { flex:1; height:38px; border-radius:9999px; border:1px solid var(--border); cursor:pointer;
  background:var(--surface); color:var(--text); font-size:14px; transition:all 0.15s ease; }
.int-btn.sel-light { border-color:rgba(90,158,111,0.35); background:var(--positive-dim); color:var(--positive); }
.int-btn.sel-mod { border-color:var(--accent-border); background:var(--accent-dim); color:var(--accent); }
.int-btn.sel-hard { border-color:rgba(179,84,84,0.35); background:var(--negative-dim); color:var(--negative); }

.stepper { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; color:var(--text2); }
.stepper-btn { width:32px; height:32px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all 0.15s ease; }

/* ── Voice Log ── */
.ai-badge { position:absolute; top:-4px; right:-4px; width:18px; height:18px;
  background:var(--accent); border-radius:50%; font-size:10px;
  display:flex; align-items:center; justify-content:center; }
.insight-card { padding:14px; border-radius:12px; margin-bottom:8px; background:var(--surface);
  border-left:3px solid transparent; }
.insight-card.green-bg { background:var(--surface); border-left-color:var(--positive); }
.insight-card.orange-bg { background:var(--surface); border-left-color:var(--caution); }
.insight-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
.insight-card.green-bg .insight-label { color:var(--positive); }
.insight-card.orange-bg .insight-label { color:var(--caution); }

/* Quick context */
.vl-header { text-align:center; margin-bottom:20px; }
.vl-header-icon { font-size:40px; color:var(--accent); margin-bottom:8px; }
.vl-header h2 { margin:0 0 4px; }
.vl-header p { font-size:14px; color:var(--text2); margin:0; }

.spar-row { display:flex; gap:12px; }
.spar-btn { flex:1; height:44px; border-radius:9999px; border:1px solid var(--border); font-size:14px; font-weight:600;
  cursor:pointer; transition:all 0.15s ease; }
.spar-btn.off { background:var(--surface); color:var(--text); }
.spar-btn.on { border-color:var(--accent-border); background:var(--accent-dim); color:var(--accent); }

/* Chat bubbles */
.vl-chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.vl-bubble { max-width:80%; padding:12px; border-radius:16px; font-size:15px; line-height:1.4; word-wrap:break-word; }
.vl-bubble-ai { align-self:flex-start; background:var(--surface); border-radius:16px 16px 16px 4px; }
.vl-bubble-user { align-self:flex-end; background:var(--accent-dim); color:var(--text); border-radius:16px 16px 4px 16px; }
.vl-bubble-skip { align-self:flex-end; background:var(--surface); color:var(--text3); font-style:italic; font-size:13px; padding:8px 12px; }
.vl-bubble-ctx { align-self:flex-start; background:var(--accent-dim); color:var(--accent); font-size:13px; font-weight:600; padding:8px 12px; }
.vl-typing { display:flex; gap:4px; padding:14px; }
.vl-typing span { width:8px; height:8px; border-radius:50%; background:var(--text2); opacity:0.5;
  animation:typingDot 1.2s infinite; }
.vl-typing span:nth-child(2) { animation-delay:0.2s; }
.vl-typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes typingDot { 0%,60%,100%{opacity:0.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }

/* Input bar */
.vl-input-bar { border-top:1px solid var(--border); padding:8px 12px 12px; display:flex; gap:8px; align-items:flex-end;
  background:var(--bg); }
.vl-input-bar input { flex:1; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface2);
  padding:0 14px; font-size:15px; color:var(--text); outline:none; transition:border-color 0.15s ease; }
.vl-input-bar input:focus { border-color:var(--accent); }
.vl-input-bar .mic-circle { width:48px; height:48px; border-radius:50%; border:none; font-size:24px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s ease;
  flex-shrink:0; -webkit-user-select:none; user-select:none; touch-action:none; }
.vl-input-bar .mic-circle.idle { background:var(--accent); color:#0C0C0E; }
.vl-input-bar .mic-circle.rec { background:var(--negative); color:#fff; animation:pulse 1.2s ease-in-out infinite;
  transform:scale(1.15); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

/* Recording indicator */
.vl-rec-indicator { display:flex; align-items:center; gap:10px; padding:8px 16px;
  background:var(--negative-dim); border-radius:12px; margin:0 12px; }
.vl-rec-dot { width:10px; height:10px; border-radius:50%; background:var(--negative);
  animation:recPulse 1s ease-in-out infinite; }
@keyframes recPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.vl-rec-indicator .rec-label { color:var(--negative); font-size:13px; font-weight:600; flex:1; }
.vl-waves { display:flex; align-items:center; gap:3px; height:24px; }
.vl-waves span { width:3px; border-radius:2px; background:var(--negative);
  animation:wave 0.8s ease-in-out infinite; }
.vl-waves span:nth-child(1) { height:8px; animation-delay:0s; }
.vl-waves span:nth-child(2) { height:16px; animation-delay:0.1s; }
.vl-waves span:nth-child(3) { height:24px; animation-delay:0.2s; }
.vl-waves span:nth-child(4) { height:16px; animation-delay:0.3s; }
.vl-waves span:nth-child(5) { height:8px; animation-delay:0.4s; }
@keyframes wave { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

.vl-send { width:36px; height:36px; border-radius:50%; border:none; background:var(--accent);
  color:#0C0C0E; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.15s ease; }

/* Progress bar */
.vl-progress { display:flex; align-items:center; justify-content:space-between; padding:8px 16px;
  background:var(--surface); font-size:13px; }
.vl-progress .done-btn { color:var(--accent); font-weight:600; cursor:pointer; background:none; border:none; font-size:13px; }

/* Live session log */
.vl-live-log { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin:0 12px 8px; overflow:hidden; }
.vl-live-toggle { display:flex; align-items:center; justify-content:space-between; padding:10px 14px;
  cursor:pointer; -webkit-user-select:none; user-select:none; }
.vl-live-toggle .label { font-size:12px; font-weight:600; color:var(--accent); }
.vl-live-toggle .count { font-size:12px; color:var(--text2); }
.vl-live-toggle .arrow { font-size:12px; color:var(--text2); transition:transform 0.2s; }
.vl-live-toggle .arrow.open { transform:rotate(180deg); }
.vl-live-body { padding:0 14px 12px; }
.vl-live-section { margin-bottom:8px; }
.vl-live-section .sec-label { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
.vl-live-items { display:flex; flex-wrap:wrap; gap:4px; }
.vl-live-items .item { font-size:11px; padding:3px 8px; border-radius:8px; background:var(--surface3); color:var(--text2); }
.vl-live-items .item.combo { background:var(--surface3); color:var(--text2); font-family:monospace; }
.vl-live-items .item.moment { background:var(--surface3); color:var(--text2); }
.vl-live-empty { font-size:12px; color:var(--text2); font-style:italic; }

/* ── Technique List ── */
.tech-cat-header { font-size:14px; font-weight:600; color:var(--accent); margin:16px 0 8px;
  display:flex; align-items:center; gap:6px; }
.tech-row { display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:6px;
  cursor:pointer; transition:all 0.15s ease; }
.tech-name { flex:1; font-size:15px; }
.tech-count { font-size:12px; color:var(--text2); }
.tech-stars { font-size:12px; color:var(--caution); }

/* ── Timer ── */
.timer-display { text-align:center; margin:30px 0; }
.timer-time { font-size:72px; font-weight:800; font-variant-numeric:tabular-nums; }
.timer-label { font-size:16px; color:var(--text2); margin-bottom:8px; }
.timer-round { font-size:18px; color:var(--accent); font-weight:600; margin-bottom:20px; }
.timer-controls { display:flex; gap:12px; justify-content:center; margin:20px 0; }
.timer-ctrl-btn { width:64px; height:64px; border-radius:50%; border:none; font-size:24px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; }
.timer-settings { margin-top:20px; }
.timer-setting { display:flex; align-items:center; justify-content:space-between;
  padding:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:8px; }
.timer-setting label { font-size:15px; }
.timer-setting .val { display:flex; align-items:center; gap:10px; }

/* ── Spinner / Toast ── */
.spinner { width:40px; height:40px; border:3px solid var(--surface3);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
.toast { position:fixed; bottom:calc(var(--tab-h) + 20px); left:50%;
  transform:translateX(-50%) translateY(100px); background:var(--surface);
  border:1px solid var(--accent-border); color:var(--accent);
  padding:14px 24px; border-radius:9999px; font-weight:600; font-size:14px;
  transition:transform 0.3s; z-index:300; }
.toast.show { transform:translateX(-50%) translateY(0); }

/* ── Combo Number System Ref ── */
.num-ref { font-size:11px; color:var(--text3); }

/* ── Search ── */
.search-bar { margin-bottom:14px; }
.search-bar input { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:10px 14px;
  font-size:15px; width:100%; color:var(--text); transition:border-color 0.15s ease; }
.search-bar input:focus { outline:none; border-color:var(--accent); }
.search-bar input::placeholder { color:var(--text3); }

/* ── Onboarding ── */
.ob-overlay { position:fixed; inset:0; background:var(--bg); z-index:500; overflow-y:auto;
  display:flex; flex-direction:column; }
.ob-overlay.hidden { display:none; }
.ob-dots { display:flex; justify-content:center; gap:6px; padding:16px 0 8px; }
.ob-dot { width:6px; height:6px; border-radius:50%; background:var(--surface3); transition:all 0.3s; }
.ob-dot.active { width:20px; border-radius:4px; background:var(--accent); }
.ob-dot.done { background:var(--accent); }
.ob-screen { flex:1; display:flex; flex-direction:column; padding:20px;
  animation:obSlideUp 0.3s ease-out; }
@keyframes obSlideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.ob-header { text-align:center; margin-bottom:24px; }
.ob-header .ob-emoji { font-size:24px; margin-bottom:12px; display:block; }
.ob-header h2 { font-size:24px; font-weight:700; margin-bottom:6px; }
.ob-header p { font-size:14px; color:var(--text2); }
.ob-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.ob-cards.single-col { grid-template-columns:1fr; }
.ob-card { padding:16px; border-radius:12px; background:var(--surface); border:1px solid var(--border);
  cursor:pointer; text-align:center; transition:all 0.15s ease; }
.ob-card.selected { border-color:var(--accent-border); background:var(--accent-dim); }
.ob-card .ob-card-emoji { font-size:24px; display:block; margin-bottom:6px; }
.ob-card .ob-card-title { font-size:15px; font-weight:600; }
.ob-card .ob-card-sub { font-size:12px; color:var(--text2); margin-top:2px; }
.ob-nav { display:flex; gap:12px; margin-top:auto; padding-top:20px; }
.ob-nav .ob-back { flex:0 0 auto; height:48px; padding:0 20px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:15px; font-weight:600; cursor:pointer;
  transition:all 0.15s ease; }
.ob-nav .ob-next { flex:1; height:48px; border-radius:12px; border:none;
  background:var(--accent); color:#0C0C0E; font-size:15px; font-weight:600; cursor:pointer;
  transition:all 0.15s ease; }
.ob-nav .ob-next:disabled { opacity:0.35; cursor:default; }
.ob-drill-count { display:flex; gap:10px; justify-content:center; margin-top:16px; }
.ob-drill-btn { width:48px; height:48px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:18px; font-weight:700; cursor:pointer;
  transition:all 0.15s ease; }
.ob-drill-btn.selected { border-color:var(--accent-border); background:var(--accent-dim); color:var(--accent); }

/* ── Drill Blocks ── */
.drill-block { background:var(--surface); border-radius:12px; padding:14px 14px 14px 16px; margin-bottom:8px;
  border-left:3px solid var(--accent); }
.drill-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.drill-name { font-size:15px; font-weight:600; }
.drill-desc { font-size:13px; color:var(--text2); line-height:1.5; margin-bottom:6px; }
.drill-combos { display:flex; flex-wrap:wrap; gap:4px; }
.drill-combo-tag { font-size:11px; font-family:monospace; padding:3px 8px; border-radius:8px;
  background:var(--surface3); color:var(--text2); }
</style>
</head>
<body>

<!-- Tab Bar -->
<nav class="tab-bar">
  <button class="tab active" onclick="switchTab('dashboard')">
    <span class="tab-icon">&#127968;</span>Home
  </button>
  <button class="tab" onclick="switchTab('sessions')">
    <span class="tab-icon">&#128203;</span>Sessions
  </button>
</nav>

<!-- Pages -->
<div class="page active" id="page-dashboard"></div>
<div class="page" id="page-sessions"></div>

<!-- Modals -->
<div class="modal-bg" id="modalQuickLog"><div class="modal" id="modalQuickLogInner"></div></div>
<div class="modal-bg" id="modalVoiceLog"><div class="modal" id="modalVoiceLogInner" style="max-height:95dvh"></div></div>
<div class="modal-bg" id="modalApiKey"><div class="modal" id="modalApiKeyInner"></div></div>
<div class="modal-bg" id="modalSessionDetail"><div class="modal" id="modalSessionDetailInner"></div></div>
<div class="modal-bg" id="modalTechDetail"><div class="modal" id="modalTechDetailInner"></div></div>

<div class="ob-overlay hidden" id="onboarding"></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  DATA & DEFAULTS
// ══════════════════════════════════════════════

const SESSION_TYPES = [
  {id:'Class',icon:'👥'},{id:'Sparring',icon:'🥊'},{id:'Drilling',icon:'🔄'},
  {id:'Bag Work',icon:'💥'},{id:'Pad Work',icon:'👏'},{id:'Shadow Boxing',icon:'👤'}
];
const DURATIONS = [15,30,45,60,90];
const INTENSITIES = ['Light','Moderate','Hard'];
const CATEGORIES = ['Punches','Clinch','Footwork','Defense','Combinations'];
const CAT_ICONS = {'Punches':'👊','Clinch':'🤼','Footwork':'👟','Defense':'🛡️','Combinations':'📋'};

const DEFAULT_TECHNIQUES = [
  // Punches
  {name:'Jab',cat:'Punches'},{name:'Cross',cat:'Punches'},{name:'Hook',cat:'Punches'},
  {name:'Uppercut',cat:'Punches'},{name:'Body Jab',cat:'Punches'},{name:'Body Hook',cat:'Punches'},
  {name:'Body Uppercut',cat:'Punches'},{name:'Overhand',cat:'Punches'},
  {name:'Lead Hook',cat:'Punches'},{name:'Rear Hook',cat:'Punches'},
  // Footwork
  {name:'Pivot',cat:'Footwork'},{name:'Angle Out',cat:'Footwork'},{name:'Cut Angle',cat:'Footwork'},
  {name:'In-Out Movement',cat:'Footwork'},{name:'Lateral Movement',cat:'Footwork'},
  {name:'Step Jab',cat:'Footwork'},{name:'L-Step',cat:'Footwork'},
  // Defense
  {name:'Parry',cat:'Defense'},{name:'Slip',cat:'Defense'},{name:'Roll',cat:'Defense'},
  {name:'Block',cat:'Defense'},{name:'Catch',cat:'Defense'},{name:'Pull Back',cat:'Defense'},
  {name:'Shoulder Roll',cat:'Defense'},{name:'Duck',cat:'Defense'},
  // Clinch
  {name:'Collar Tie',cat:'Clinch'},{name:'Underhook',cat:'Clinch'},{name:'Body Lock',cat:'Clinch'},
];

const DEFAULT_COMBOS = [
  {num:'1-2',name:'Basic One-Two',notes:'Jab followed by cross. Foundation of boxing.'},
  {num:'1-1-2',name:'Double Jab Cross',notes:'Two jabs to set up the cross'},
  {num:'1-2-3',name:'Jab Cross Hook',notes:'Classic three-punch combo'},
  {num:'1-2-3-2',name:null,notes:'Jab, cross, hook, cross'},
  {num:'1-2-5-2',name:null,notes:'Jab, cross, lead uppercut, cross'},
  {num:'3-2',name:'Check Hook Cross',notes:'Lead with hook, follow with cross'},
  {num:'3-2-3',name:null,notes:'Hook, cross, hook'},
  {num:'2-3-2',name:'Counter Cross',notes:'Cross, hook, cross'},
  {num:'5-2-3',name:null,notes:'Lead uppercut, cross, hook'},
  {num:'6-3-2',name:null,notes:'Rear uppercut, lead hook, cross'},
  {num:'1-6-3-2',name:null,notes:'Jab, rear uppercut, lead hook, cross'},
  {num:'3-6-3',name:null,notes:'Lead hook, rear uppercut, lead hook'},
  {num:'1-1-2-3',name:null,notes:'Double jab, cross, lead hook'},
  {num:'2-3-6',name:null,notes:'Cross, lead hook, rear uppercut'},
  {num:'1-2-1-2',name:null,notes:'Jab, cross, jab, cross - double one-two'},
];

const NUM_MAP = {'1':'Jab','2':'Cross','3':'Lead Hook','4':'Rear Hook','5':'Lead Uppercut',
  '6':'Rear Uppercut','7':'Lead Body Hook','8':'Rear Body Hook','1b':'Body Jab','2b':'Body Cross'};

// ══════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════

function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function db() {
  if (!localStorage.getItem('fl_init')) {
    save('fl_techniques', DEFAULT_TECHNIQUES.map((t,i) => ({id:i, name:t.name, cat:t.cat, useCount:0, lastUsed:null, rating:0, notes:'', keyPoints:[], commonMistakes:''})));
    save('fl_combos', DEFAULT_COMBOS.map((c,i) => ({id:i, num:c.num, name:c.name, notes:c.notes, useCount:0, lastUsed:null, isCustom:false})));
    save('fl_sessions', []);
    save('fl_goals', {weeklyTarget:3, streak:0, longestStreak:0, lastTrainDate:null});
    localStorage.setItem('fl_init','1');
    localStorage.setItem('fl_nextTechId', String(DEFAULT_TECHNIQUES.length));
    localStorage.setItem('fl_nextComboId', String(DEFAULT_COMBOS.length));
  }
}

function getTechniques() { return load('fl_techniques', []); }
function saveTechniques(t) { save('fl_techniques', t); }
function getCombos() { return load('fl_combos', []); }
function saveCombos(c) { save('fl_combos', c); }
function getSessions() { return load('fl_sessions', []); }
function saveSessions(s) { save('fl_sessions', s); }
function getGoals() { return load('fl_goals', {weeklyTarget:3, streak:0, longestStreak:0, lastTrainDate:null}); }
function saveGoals(g) { save('fl_goals', g); }

function nextTechId() { let id = parseInt(localStorage.getItem('fl_nextTechId')||'100'); localStorage.setItem('fl_nextTechId',String(id+1)); return id; }
function nextComboId() { let id = parseInt(localStorage.getItem('fl_nextComboId')||'100'); localStorage.setItem('fl_nextComboId',String(id+1)); return id; }

// ══════════════════════════════════════════════
//  PROFILE & ONBOARDING
// ══════════════════════════════════════════════

function getProfile() { return load('fl_profile', null); }
function saveProfile(p) { save('fl_profile', p); }

const OB_DEFAULTS = {
  name:'', disciplines:[], experience:'', goal:'',
  typicalType:'Class', typicalDuration:60, typicalIntensity:'Moderate', typicalSpar:false,
  trainingFormat:[], typicalDrillCount:3, onboardingComplete:false
};

let ob = {...OB_DEFAULTS};
let obStep = 0;

const DISCIPLINES = [{id:'Boxing',emoji:'🥊'}];
const EXP_LEVELS = [
  {id:'Beginner',emoji:'🌱',sub:'Less than 1 year'},
  {id:'Intermediate',emoji:'🔥',sub:'1–3 years'},
  {id:'Advanced',emoji:'⚡',sub:'3+ years'},
  {id:'Pro',emoji:'🏅',sub:'Competing regularly'}
];
const GOALS = [
  {id:'General Fitness',emoji:'💪',sub:'Stay sharp & in shape'},
  {id:'Competition Prep',emoji:'🏆',sub:'Train to compete'},
  {id:'Self Defense',emoji:'🛡️',sub:'Learn to protect yourself'},
  {id:'Fun & Stress Relief',emoji:'😄',sub:'Enjoy the art'}
];
const FORMATS = [
  {id:'partner_pads',emoji:'👏',title:'Partner pad rotation',sub:'I hold pads, then we swap'},
  {id:'coach_led',emoji:'📋',title:'Coach calls drills',sub:'Coach/trainer runs the session'},
  {id:'solo',emoji:'🥊',title:'Solo bag/shadow',sub:'I mostly train alone'},
  {id:'mixed',emoji:'🔄',title:'Mixed',sub:'Varies each session'}
];

function obValid() {
  if(obStep===0) return ob.name.trim().length>0;
  if(obStep===1) return !!ob.experience;
  if(obStep===2) return !!ob.goal;
  if(obStep===3) return true; // all have defaults
  if(obStep===4) return ob.trainingFormat.length>0;
  if(obStep===5) return true; // API key optional
  return true;
}

function obNext() { if(!obValid()) return; if(obStep<5){obStep++;renderOnboarding();} else finishOnboarding(); }
function obBack() { if(obStep>0){obStep--;renderOnboarding();} }

function renderOnboarding() {
  const el = document.getElementById('onboarding');
  const totalSteps = 6;
  const dots = Array.from({length:totalSteps},(_,i)=>
    `<div class="ob-dot ${i===obStep?'active':i<obStep?'done':''}"></div>`).join('');

  let screen = '';
  if(obStep===0) screen = obScreen0();
  else if(obStep===1) screen = obScreen2();
  else if(obStep===2) screen = obScreen3();
  else if(obStep===3) screen = obScreen4();
  else if(obStep===4) screen = obScreen5();
  else if(obStep===5) screen = obScreen6();

  el.innerHTML = `<div class="ob-dots">${dots}</div><div class="ob-screen">${screen}
    <div class="ob-nav">
      ${obStep>0?'<button class="ob-back" onclick="obBack()">Back</button>':''}
      <button class="ob-next" onclick="obNext()" ${obValid()?'':'disabled'}>
        ${obStep===5?'Start Logging':'Next'}</button>
    </div></div>`;
}

// Screen 0: Name
function obScreen0() {
  return `<div class="ob-header"><span class="ob-emoji">🥊</span>
    <h2>Welcome to FightLog</h2><p>The Striking Arts Training Journal</p></div>
    <div class="section"><div class="section-title">What's your name?</div>
      <input type="text" id="obName" placeholder="Your name" value="${esc(ob.name)}"
        oninput="ob.name=this.value;document.querySelector('.ob-next').disabled=!obValid()"
        style="font-size:18px;text-align:center;padding:16px"></div>`;
}

// Screen 1: Disciplines
function obScreen1() {
  return `<div class="ob-header"><span class="ob-emoji">🥋</span>
    <h2>What do you train?</h2><p>Select up to 3</p></div>
    <div class="ob-cards">${DISCIPLINES.map(d=>{
      const sel = ob.disciplines.includes(d.id);
      return `<div class="ob-card ${sel?'selected':''}" onclick="toggleOBDisc('${d.id}')">
        <span class="ob-card-emoji">${d.emoji}</span><div class="ob-card-title">${d.id}</div></div>`;
    }).join('')}</div>`;
}
function toggleOBDisc(id) {
  const i=ob.disciplines.indexOf(id);
  if(i>=0) ob.disciplines.splice(i,1);
  else if(ob.disciplines.length<3) ob.disciplines.push(id);
  renderOnboarding();
}

// Screen 2: Experience
function obScreen2() {
  return `<div class="ob-header"><span class="ob-emoji">📊</span>
    <h2>Experience level?</h2></div>
    <div class="ob-cards single-col">${EXP_LEVELS.map(e=>
      `<div class="ob-card ${ob.experience===e.id?'selected':''}" onclick="ob.experience='${e.id}';renderOnboarding()">
        <span class="ob-card-emoji">${e.emoji}</span><div class="ob-card-title">${e.id}</div>
        <div class="ob-card-sub">${e.sub}</div></div>`).join('')}</div>`;
}

// Screen 3: Goal
function obScreen3() {
  return `<div class="ob-header"><span class="ob-emoji">🎯</span>
    <h2>What's your goal?</h2></div>
    <div class="ob-cards">${GOALS.map(g=>
      `<div class="ob-card ${ob.goal===g.id?'selected':''}" onclick="ob.goal='${g.id}';renderOnboarding()">
        <span class="ob-card-emoji">${g.emoji}</span><div class="ob-card-title">${g.id}</div>
        <div class="ob-card-sub">${g.sub}</div></div>`).join('')}</div>`;
}

// Screen 4: Typical Session
function obScreen4() {
  return `<div class="ob-header"><span class="ob-emoji">⏱️</span>
    <h2>Your typical session</h2><p>We'll use these as defaults</p></div>

    <div class="section"><div class="section-title">Session type</div>
      <div class="type-grid">${SESSION_TYPES.map(t=>
        `<button class="type-btn ${ob.typicalType===t.id?'selected':''}" onclick="ob.typicalType='${t.id}';renderOnboarding()">
          <span class="t-icon">${t.icon}</span>${t.id}</button>`).join('')}</div></div>

    <div class="section"><div class="section-title">Duration</div>
      <div class="dur-row">${[30,45,60,90,120].map(d=>
        `<button class="dur-btn ${ob.typicalDuration===d?'selected':''}" onclick="ob.typicalDuration=${d};renderOnboarding()">${d}m</button>`).join('')}</div></div>

    <div class="section"><div class="section-title">Intensity</div>
      <div class="int-row">${INTENSITIES.map(i=>{
        const sel=ob.typicalIntensity===i;
        const cls=sel?(i==='Light'?'sel-light':i==='Moderate'?'sel-mod':'sel-hard'):'';
        return `<button class="int-btn ${cls}" onclick="ob.typicalIntensity=ob.typicalIntensity==='${i}'?null:'${i}';renderOnboarding()">${i}</button>`;
      }).join('')}</div></div>

    <div class="section"><div class="section-title">Do you usually spar?</div>
      <div class="spar-row">
        <button class="spar-btn ${ob.typicalSpar?'on':'off'}" onclick="ob.typicalSpar=true;renderOnboarding()">Yes</button>
        <button class="spar-btn ${!ob.typicalSpar?'on':'off'}" onclick="ob.typicalSpar=false;renderOnboarding()">No</button>
      </div></div>`;
}

// Screen 5: Training Format
function obScreen5() {
  return `<div class="ob-header"><span class="ob-emoji">🔄</span>
    <h2>How do drills work?</h2><p>Select all that apply</p></div>
    <div class="ob-cards single-col">${FORMATS.map(f=>{
      const sel = ob.trainingFormat.includes(f.id);
      return `<div class="ob-card ${sel?'selected':''}" onclick="toggleOBFormat('${f.id}')">
        <span class="ob-card-emoji">${f.emoji}</span><div class="ob-card-title">${f.title}</div>
        <div class="ob-card-sub">${f.sub}</div></div>`;}).join('')}</div>
    <div class="section" style="margin-top:16px"><div class="section-title">Typical drills per session</div>
      <div class="ob-drill-count">${[2,3,4,5].map(n=>
        `<button class="ob-drill-btn ${ob.typicalDrillCount===n?'selected':''}" onclick="ob.typicalDrillCount=${n};renderOnboarding()">${n}${n===5?'+':''}</button>`).join('')}</div></div>`;
}

function toggleOBFormat(id) {
  const i=ob.trainingFormat.indexOf(id);
  if(i>=0) ob.trainingFormat.splice(i,1);
  else ob.trainingFormat.push(id);
  renderOnboarding();
}

// Screen 6: API Key
function obScreen6() {
  const hasKey = !!localStorage.getItem('claude_api_key');
  return `<div class="ob-header"><span class="ob-emoji">🔑</span>
    <h2>Almost done!</h2><p>Add your Claude API key to power AI session logging</p></div>
    <div class="section">
      <input type="password" id="obApiKey" placeholder="sk-ant-..." value="${localStorage.getItem('claude_api_key')||''}"
        style="font-size:15px" autocomplete="off">
      <a href="https://console.anthropic.com/settings/keys" target="_blank"
        style="display:block;text-align:center;color:var(--accent);font-size:13px;margin-top:10px;text-decoration:none">
        Get a key from Anthropic &rarr;</a>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text2)">
      ${hasKey?'&#10003; Key already saved':'You can add this later in settings'}</div>`;
}

function finishOnboarding() {
  // Save API key if entered
  const keyInput = document.getElementById('obApiKey');
  if(keyInput) {
    const k = keyInput.value.trim();
    if(k) localStorage.setItem('claude_api_key', k);
  }
  // Save profile - auto-set Boxing
  ob.disciplines = ['Boxing'];
  ob.onboardingComplete = true;
  saveProfile(ob);
  // Hide onboarding
  document.getElementById('onboarding').classList.add('hidden');
  renderDashboard();
}

function editProfile() {
  const p = getProfile();
  if(p) { ob = {...OB_DEFAULTS, ...p, onboardingComplete:false}; }
  obStep = 0;
  document.getElementById('onboarding').classList.remove('hidden');
  renderOnboarding();
}

function buildProfileContext() {
  const p = getProfile();
  if(!p) return '';
  const formatMap = {partner_pads:'Partner pad rotation (swap roles)',coach_led:'Coach-led drills',solo:'Solo bag/shadow work',mixed:'Mixed format'};
  let ctx = 'Boxer profile:';
  ctx += '\n- Name: ' + p.name;
  ctx += '\n- Discipline: Boxing';
  ctx += '\n- Experience: ' + p.experience;
  ctx += '\n- Goal: ' + p.goal;
  ctx += '\n- Typical session: ' + p.typicalDuration + ' min ' + p.typicalType + ' at ' + (p.typicalIntensity||'moderate') + ' intensity';
  const fmts = Array.isArray(p.trainingFormat) ? p.trainingFormat : (p.trainingFormat ? [p.trainingFormat] : ['mixed']);
  ctx += '\n- Training format: ' + fmts.map(f=>formatMap[f]||f).join(', ');
  ctx += '\n- Usually does ~' + p.typicalDrillCount + ' drills per session';
  ctx += p.typicalSpar ? '\n- Usually spars' : '\n- Does not usually spar';
  return ctx;
}

// ══════════════════════════════════════════════
//  APP STATE
// ══════════════════════════════════════════════

let currentTab = 'dashboard';
let techSearch = '';
let comboSearch = '';

// Quick Log state
let ql = { type:'Class', duration:60, intensity:null, techniques:new Set(), combos:new Set(), notes:'' };

// Voice Log state
let vl = { phase:'quickContext', recording:false, error:null,
  // Quick context
  selType:'Class', selDur:60, selInt:'Moderate', didSpar:false,
  // Guided recall
  conversation:[], currentQuestion:'', currentAnswer:'', isLoadingQ:false,
  // Review
  sugType:null, sugDur:null, sugInt:null, sugTech:[], sugCombo:[], sugDrills:[],
  wentWell:null, toImprove:null, followUp:[],
  selTech:new Set(), selCombo:new Set(), notes:'' };

// Timer state
let timer = { rounds:5, roundTime:180, restTime:60, currentRound:0, timeLeft:0,
  isRest:false, running:false, interval:null };

let recognition = null;

// ══════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.tab')[['dashboard','sessions'].indexOf(tab)].classList.add('active');
  renderPage(tab);
}

function renderPage(tab) {
  if (tab==='dashboard') renderDashboard();
  else if (tab==='sessions') renderSessions();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

// ══════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════

function renderDashboard() {
  const sessions = getSessions();
  const goals = getGoals();
  const thisWeek = sessionsThisWeek(sessions);
  const weekMins = totalMinutes(thisWeek);
  const profile = getProfile();
  const greeting = profile?.name ? `Hey ${esc(profile.name)}` : 'FightLog';

  let recentHTML = '';
  if (sessions.length) {
    const rows = sessions.slice(0,5).map(s => sessionRowHTML(s)).join('');
    recentHTML = `<div class="session-list">${rows}
      ${sessions.length>5?`<div class="list-footer"><button class="btn btn-ghost btn-sm" onclick="switchTab('sessions')">View all</button></div>`:''}
    </div>`;
  } else {
    recentHTML = `<div class="empty-state"><span class="empty-icon">&#129354;</span>
      <p>No sessions yet</p><p class="empty-cta">Tap "Log Training" to get started</p></div>`;
  }

  // Secondary stats line
  const secondaryParts = [];
  if (weekMins > 0) secondaryParts.push(`${weekMins} min`);
  if (goals.streak > 0) secondaryParts.push(`${goals.streak} day streak`);
  if (sessions.length > 0) secondaryParts.push(`${sessions.length} total`);
  const secondaryLine = secondaryParts.join(' \u00b7 ');

  document.getElementById('page-dashboard').innerHTML = `

function sessionsThisWeek(sessions) {
  const now = new Date();
  const day = now.getDay(), diff = now.getDate() - day + (day===0?-6:1);
  const start = new Date(now.setHours(0,0,0,0)); start.setDate(diff);
  return sessions.filter(s => new Date(s.timestamp) >= start);
}
function totalMinutes(sessions) { return sessions.reduce((a,s) => a + s.duration, 0); }

function sessionRowHTML(s) {
  const t = SESSION_TYPES.find(x=>x.id===s.type)||{icon:'🥊'};
  const d = new Date(s.timestamp);
  const dateStr = formatDate(d);
  const meta = [s.duration+'m', s.intensity, s.drills?.length?s.drills.length+' drills':null, s.techniques?.length?s.techniques.length+' tech':null].filter(Boolean).join(' · ');
  return `<div class="session-row" onclick="showSessionDetail('${s.id}')">
    <div class="session-icon">${t.icon}</div>
    <div class="session-info"><div class="session-type">${s.type}</div><div class="session-meta">${meta}</div></div>
    <div class="session-date">${dateStr}</div>
  </div>`;
}

function formatDate(d) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tgt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (today-tgt)/(1000*60*60*24);
  if (diff===0) return 'Today';
  if (diff===1) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function toggleQL(field, id) {
  if (ql[field].has(id)) ql[field].delete(id); else ql[field].add(id);
  renderQuickLog();

function saveQuickLog() {
  const techs = getTechniques();
  const combos = getCombos();
  const selTechNames = [...ql.techniques].map(id => techs.find(t=>t.id===id)?.name).filter(Boolean);
  const selComboNums = [...ql.combos].map(id => combos.find(c=>c.id===id)?.num).filter(Boolean);

  // Update use counts
  for (const id of ql.techniques) { const t = techs.find(x=>x.id===id); if(t){t.useCount++;t.lastUsed=new Date().toISOString();} }
  saveTechniques(techs);
  for (const id of ql.combos) { const c = combos.find(x=>x.id===id); if(c){c.useCount++;c.lastUsed=new Date().toISOString();} }
  saveCombos(combos);

  const sessions = getSessions();
  sessions.unshift({
    id: Date.now().toString(),
    type: ql.type, duration: ql.duration, intensity: ql.intensity,
    techniques: selTechNames, combos: selComboNums,
    notes: ql.notes, timestamp: new Date().toISOString()
  });
  saveSessions(sessions);
  updateStreak();
  closeModal('modalQuickLog');
  showToast('Session Saved!');
  renderDashboard();
}

function updateStreak() {
  const goals = getGoals();
  const today = new Date().toDateString();
  if (goals.lastTrainDate !== today) {
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    if (goals.lastTrainDate === yesterday.toDateString()) {
      goals.streak++;
    } else if (goals.lastTrainDate !== today) {
      goals.streak = 1;
    }
    goals.lastTrainDate = today;
    goals.longestStreak = Math.max(goals.longestStreak, goals.streak);
    saveGoals(goals);
  }
}

// ── Live session detection ──
let vlLiveLog = { techs:new Set(), combos:new Set(), moments:[], expanded:true };

function scanAnswerForDetections(answer) {
  if(!answer) return;
  const lower = answer.toLowerCase();
  const techs = getTechniques();
  const combos = getCombos();
  // Scan for technique names
  for(const t of techs) {
    if(lower.includes(t.name.toLowerCase())) vlLiveLog.techs.add(t.name);
  }
  // Scan for combo numbers
  for(const c of combos) {
    if(lower.includes(c.num.toLowerCase()) || (c.name && lower.includes(c.name.toLowerCase()))) vlLiveLog.combos.add(c.num);
  }
  // Extract key moments (short phrases about what happened)
  const momentKeywords = ['warmup','warm up','warmed up','shadow box','bag work','pad work','pads','heavy bag','drills','drill','rounds','sparred','partner','mitt','mitts','coach','cooldown','cool down','stretched'];
  for(const kw of momentKeywords) {
    if(lower.includes(kw) && !vlLiveLog.moments.includes(kw)) vlLiveLog.moments.push(kw);
  }
}

function renderLiveLog() {
  const totalItems = vlLiveLog.techs.size + vlLiveLog.combos.size + vlLiveLog.moments.length;
  if(totalItems===0 && vl.conversation.length===0) return '';

  const body = vlLiveLog.expanded ? `<div class="vl-live-body">
    ${vlLiveLog.techs.size?`<div class="vl-live-section"><div class="sec-label">Techniques detected</div>
      <div class="vl-live-items">${[...vlLiveLog.techs].map(t=>`<span class="item">${esc(t)}</span>`).join('')}</div></div>`:''}
    ${vlLiveLog.combos.size?`<div class="vl-live-section"><div class="sec-label">Combos detected</div>
      <div class="vl-live-items">${[...vlLiveLog.combos].map(c=>`<span class="item combo">${esc(c)}</span>`).join('')}</div></div>`:''}
    ${vlLiveLog.moments.length?`<div class="vl-live-section"><div class="sec-label">Session activity</div>
      <div class="vl-live-items">${vlLiveLog.moments.map(m=>`<span class="item moment">${esc(m)}</span>`).join('')}</div></div>`:''}
    ${totalItems===0?`<div class="vl-live-empty">Keep talking - detections will appear here</div>`:''}
  </div>` : '';

  return `<div class="vl-live-log">
    <div class="vl-live-toggle" onclick="vlLiveLog.expanded=!vlLiveLog.expanded;renderVoiceLog()">
      <span class="label">&#128203; Session Log</span>
      <span class="count">${totalItems} detected</span>
      <span class="arrow ${vlLiveLog.expanded?'open':''}">&#9660;</span>
    </div>
    ${body}
  </div>`;
}

function scrollVLChat() {
  setTimeout(()=>{ const c=document.getElementById('vlChat'); if(c) c.scrollTop=c.scrollHeight; },50);
}

let vlAccumulatedText = '';

function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR(); r.continuous=true; r.interimResults=false; r.lang='en-US';
  r.onresult = e => {
    // Grab new final results and append to accumulated text
    for(let i=0; i<e.results.length; i++) {
      if(e.results[i].isFinal) {
        vlAccumulatedText += e.results[i][0].transcript + ' ';
      }
    }
    vl.currentAnswer = vlAccumulatedText.trim();
  };
  r.onerror = e => { if(e.error!=='no-speech'&&e.error!=='aborted'){vl.error='Speech error: '+e.error; vl.recording=false; renderVoiceLog();} };
  r.onend = () => {
    // Chrome stops after silence - restart to keep listening
    if(vl.recording && recognition) { try{recognition.start();}catch(e){} }
  };
  return r;
}

// Tap to start recording, tap again to stop and auto-send
function toggleVLMic() {
  if (vl.isLoadingQ) return;
  if (vl.recording) {
    // Stop and send
    stopVLRecording();
    setTimeout(()=>{
      const answer = (vl.currentAnswer||'').trim();
      if (answer) { submitVLAnswer(); }
      else { renderVoiceLog(); }
    }, 500);
  } else {
    // Start recording
    if (recognition) { try { recognition.abort(); } catch(e2) {} recognition=null; }
    recognition = initSpeech();
    if (!recognition) { vl.error='Speech recognition not available. Use Chrome on Android.'; renderVoiceLog(); return; }
    vl.error=null; vl.currentAnswer=''; vlAccumulatedText='';
    try { recognition.start(); vl.recording=true; } catch(e2) { vl.error=e2.message; }
    renderVoiceLog();
  }
}

function stopVLRecording() { if(recognition){try{recognition.stop();}catch(e){}} vl.recording=false; }

function sendVLText() {
  const input = document.getElementById('vlTextInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  vl.currentAnswer = text;
  submitVLAnswer();
}

async function submitVLAnswer() {
  const answer = (vl.currentAnswer||'').trim();
  if (!answer) return;
  stopVLRecording();
  scanAnswerForDetections(answer);
  vl.conversation.push({question:vl.currentQuestion, answer});
  vl.currentAnswer='';
  await fetchNextVLQuestion();
}

async function skipVLQuestion() {
  stopVLRecording();
  vl.conversation.push({question:vl.currentQuestion, answer:''});
  vl.currentAnswer='';
  await fetchNextVLQuestion();
}

async function finishVLRecall() {
  const answer = (vl.currentAnswer||'').trim();
  if (answer) {
    stopVLRecording();
    scanAnswerForDetections(answer);
    vl.conversation.push({question:vl.currentQuestion, answer});
    vl.currentAnswer='';
  }
  await assembleVLSession();
}

async function fetchNextVLQuestion() {
  vl.isLoadingQ=true; vl.error=null; renderVoiceLog();

  const apiKey=localStorage.getItem('claude_api_key');
  const techs=getTechniques(), combos=getCombos();

  let convText = `Session context: ${vl.selType}, ${vl.selDur} min, ${vl.selInt||'unspecified'} intensity`;
  convText += vl.didSpar ? '. They DID spar.' : '. They did NOT spar - do NOT ask about sparring.';
  convText += '\n\nConversation so far:';
  for(const t of vl.conversation) {
    convText += '\nQ: '+t.question;
    convText += '\nA: '+(t.answer||'[skipped]');
  }

  const sysPrompt = `You help a boxer recall what they did in their boxing training session so they can log it. Ask ONE short question at a time about what actually happened - you are just helping them remember, NOT coaching or giving tips.
IMPORTANT: Respond with ONLY a JSON object: {"question":"Your question","isComplete":false}
Example questions (pick based on what's not been covered yet):
- "What did you do for warmup?"
- "Did you do any pad work or bag work?"
- "What drills did coach have you do?"
- "Did you work with a partner on anything?"
- "Any combos you remember drilling?"
- "How did sparring go? Any specific rounds stand out?"
- "Anything else happen in the session?"
Rules:
- ONLY ask about what they DID in the session - don't give advice or tips
- Keep questions casual and short, like a friend asking about their day
- Focus on helping them walk through the session chronologically (warmup → drills → main work → cooldown)
- The session context tells you if they sparred or not - NEVER ask about sparring if they said they didn't
- After 3-5 questions or when they've covered the main parts of the session, set isComplete to true
- Don't repeat topics already covered
- Don't ask about things already answered in the session context (type, duration, intensity, sparring)`;

  const profileCtx = buildProfileContext();
  const fullPrompt = profileCtx ? sysPrompt + '\n\n' + profileCtx : sysPrompt;

  try {
    const data = await callClaude(apiKey, {model:'claude-sonnet-4-5-20250929',max_tokens:256,system:fullPrompt,messages:[{role:'user',content:convText}]});
    const content=data.content?.[0]?.text||'';
    const cleaned=content.replace(/```json/g,'').replace(/```/g,'').trim();
    const r=JSON.parse(cleaned);

    vl.isLoadingQ=false;
    if(r.isComplete) { await assembleVLSession(); return; }
    vl.currentQuestion=r.question;
  } catch(e) {
    vl.isLoadingQ=false;
    vl.error=e.message;
    vl.currentQuestion='Anything else you\'d like to add about your session?';
  }
  renderVoiceLog();
}

  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px">
    <div class="spinner"></div><div style="font-size:18px;font-weight:700">Putting it all together...</div>
    <div style="font-size:14px;color:var(--text2)">AI is assembling your session from the conversation</div></div>`;
}

async function assembleVLSession() {
  vl.phase='assembling'; vl.error=null; renderVoiceLog();

  const apiKey=localStorage.getItem('claude_api_key');
  const techs=getTechniques(), combos=getCombos();
  const techNames=techs.map(t=>t.name), comboNames=combos.map(c=>c.num);

  let transcript = `Session basics: ${vl.selType} session, ${vl.selDur} minutes, ${vl.selInt||'unspecified'} intensity.`;
  if(vl.didSpar) transcript += ' Included sparring.';
  transcript += '\n\nDetailed recall interview:';
  for(const t of vl.conversation) {
    transcript += '\nQ: '+t.question;
    if(t.answer) transcript += '\nA: '+t.answer;
  }

  const sysPrompt = `You are a boxing training assistant. Extract structured data from the user's recall interview.
IMPORTANT: Respond with ONLY a JSON object:
{"sessionType":"Class"|"Sparring"|"Drilling"|"Bag Work"|"Pad Work"|"Shadow Boxing"|null,
"duration":null,"intensity":null,
"techniques":["name1"],"combos":["1-2-3"],
"drills":[
  {"name":"Warmup","description":"Jump rope 3 rds, shadow boxing","combos":[]},
  {"name":"Pad Work","description":"1-2 × 2 reps, 1-2-3 hip rotation × 2 reps. 3 rds","combos":["1-2","1-2-3"]}
],
"wentWell":"..." or null,"toImprove":"..." or null,"followUpQuestions":[]}
Known techniques: ${techNames.join(', ')}
Known combos: ${comboNames.join(', ')}
Match against known lists. Use exact names/numbers. Only include what was actually mentioned.
DRILL RULES:
- Break the session into chronological drills/phases the user described (warmup, pad work, bag work, sparring, conditioning, cooldown, etc.)
- Only include phases the user actually mentioned - do NOT fabricate warmup/cooldown
- Each drill: descriptive name, what was done, which combos were used
- Use combo number format in combos array (e.g. "1-2-3")
- CLEAN UP the description - don't copy user's messy text. Rewrite as short combo-focused notes
- Use terse format: "1 × 2 reps, 1-2 slip × 2 reps, 1-2-7-3-2. 5 min each, swap."
- Reference combos by number, add reps/rounds/time. No prose or full sentences. Keep it scannable.
- Pull ALL combos into the combos array using number format - the description is the quick reference, the array is the definitive list`;

  const profileCtx2 = buildProfileContext();
  const fullAssemblyPrompt = profileCtx2 ? sysPrompt + '\n\n' + profileCtx2 : sysPrompt;

  try {
    const data = await callClaude(apiKey, {model:'claude-sonnet-4-5-20250929',max_tokens:1536,system:fullAssemblyPrompt,messages:[{role:'user',content:transcript}]});
    const content=data.content?.[0]?.text||'';
    const cleaned=content.replace(/```json/g,'').replace(/```/g,'').trim();
    const a=JSON.parse(cleaned);

    if(a.sessionType) vl.sugType=a.sessionType;
    if(a.duration){vl.sugDur=a.duration;}
    if(a.intensity){vl.sugInt=a.intensity;}
    vl.sugTech=a.techniques||[];
    for(const n of vl.sugTech){const m=techs.find(t=>t.name.toLowerCase()===n.toLowerCase());if(m)vl.selTech.add(m.name);}
    vl.sugCombo=a.combos||[];
    for(const n of vl.sugCombo){const m=combos.find(c=>c.num.toLowerCase()===n.toLowerCase());if(m)vl.selCombo.add(m.num);}
    vl.sugDrills=a.drills||[];
    vl.wentWell=a.wentWell||null; vl.toImprove=a.toImprove||null; vl.followUp=a.followUpQuestions||[];
    let notes=[]; if(vl.wentWell)notes.push('Went well: '+vl.wentWell); if(vl.toImprove)notes.push('To improve: '+vl.toImprove);
    vl.notes=notes.join('\n');
    vl.phase='review';
  } catch(e) { vl.error=e.message; vl.phase='guidedRecall'; }
  renderVoiceLog();
}

function drillIconFor(name) {
  const n = name.toLowerCase();
  if (n.includes('warmup') || n.includes('warm up')) return '🔥';
  if (n.includes('shadow')) return '👤';
  if (n.includes('pad') || n.includes('mitt')) return '👏';
  if (n.includes('bag')) return '💥';
  if (n.includes('spar')) return '🥊';
  if (n.includes('drill')) return '🔄';
  if (n.includes('conditioning') || n.includes('cardio') || n.includes('circuit')) return '⚡';
  if (n.includes('cool') || n.includes('stretch')) return '🧊';
  if (n.includes('clinch')) return '🤼';
  if (n.includes('footwork')) return '👟';
  if (n.includes('defense')) return '🛡️';

}

function parseDrillInput(drillIndex) {
  const input = document.getElementById('drillAdd'+drillIndex);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  // Extract combo patterns: sequences of numbers/letters separated by dashes (e.g. 1-2, 1-2-3, 2-3-2, 1-2-7-3-2, 1b-2)
  const comboPattern = /\b(\d[b]?(?:-\d[b]?){1,})\b/gi;
  const found = [];
  let match;
  while ((match = comboPattern.exec(text)) !== null) {
    const combo = match[1].trim();
    if (!found.includes(combo)) found.push(combo);
  }

  // Also check for standalone single numbers that look like punches in context (e.g. "jabs only" = 1)
  // Map common names to numbers
  const nameMap = {
    'jab':['1'],'jabs':['1'],'cross':['2'],'hook':['3'],'lead hook':['3'],
    'rear hook':['4'],'lead uppercut':['5'],'rear uppercut':['6'],
    'body hook':['7'],'left body hook':['7'],'right body hook':['8'],
    'body jab':['1b'],'body cross':['2b']
  };

  if (!editSession.drills[drillIndex].combos) editSession.drills[drillIndex].combos = [];

  // Add extracted combos (skip duplicates already on the drill)
  const existing = new Set(editSession.drills[drillIndex].combos.map(c=>c.toLowerCase()));
  for (const c of found) {
    if (!existing.has(c.toLowerCase())) {
      editSession.drills[drillIndex].combos.push(c);
      existing.add(c.toLowerCase());
    }
  }

  // Append cleaned text to description
  const desc = editSession.drills[drillIndex].description || '';
  editSession.drills[drillIndex].description = desc ? desc + '. ' + text : text;

  renderEditSession();
}

// ══════════════════════════════════════════════

function renderCombos() {
  const combos = getCombos();
  const filtered = comboSearch ? combos.filter(c=>(c.num+' '+(c.name||'')).toLowerCase().includes(comboSearch.toLowerCase())) : combos;

  document.getElementById('page-combos').innerHTML = `
    <div class="page-header"><div class="row"><h1>Combos</h1><div class="spacer"></div>
      <button class="btn btn-primary btn-sm" onclick="addComboPrompt()">+ Add</button></div>
      <div class="num-ref" style="margin-top:4px">1=Jab 2=Cross 3=Hook 4=Rear Hook 5=Lead Upper 6=Rear Upper</div></div>
    <div class="page-content">
      <div class="search-bar"><input type="text" placeholder="Search combos..." value="${esc(comboSearch)}"
        oninput="comboSearch=this.value;renderCombos()"></div>
      ${filtered.map(c => `<div class="card" style="cursor:pointer">
        <div class="row">
          <strong style="font-family:monospace;font-size:17px">${esc(c.num)}</strong>
          <div class="spacer"></div>
          <span style="font-size:12px;color:var(--text2)">${c.useCount}x</span>
        </div>
        ${c.name?`<div style="font-size:13px;color:var(--accent);margin-top:4px">${esc(c.name)}</div>`:''}
        <div style="font-size:12px;color:var(--text2);margin-top:4px">${comboBreakdown(c.num)}</div>
        ${c.notes?`<div style="font-size:13px;color:var(--text2);margin-top:6px;font-style:italic">${esc(c.notes)}</div>`:''}
      </div>`).join('') || '<div class="empty-state">No combos found</div>'}
    </div>`;
}

function comboBreakdown(num) {
  return num.split('-').map(n => NUM_MAP[n] || NUM_MAP[n.toUpperCase()] || n).join(' → ');
}

function addComboPrompt() {
  const num = prompt('Combo numbers (e.g. 1-2-3-LK):');
  if(!num?.trim()) return;
  const name = prompt('Name (optional):');
  const combos=getCombos();
  combos.push({id:nextComboId(),num:num.trim(),name:name?.trim()||null,notes:null,useCount:0,lastUsed:null,isCustom:true});
  saveCombos(combos); renderCombos(); showToast('Combo added');
}

// ══════════════════════════════════════════════
//  ROUND TIMER
// ══════════════════════════════════════════════

function renderTimer() {
  const mins = Math.floor(timer.timeLeft/60);
  const secs = timer.timeLeft%60;
  const display = `${mins}:${secs.toString().padStart(2,'0')}`;
  const color = timer.running ? (timer.isRest ? 'var(--accent)' : 'var(--positive)') : 'var(--text)';
  const label = timer.running ? (timer.isRest ? 'REST' : 'ROUND') : 'READY';

  document.getElementById('page-timer').innerHTML = `
    <div class="page-header"><h1>Round Timer</h1></div>
    <div class="page-content">
      <div class="timer-display">
        <div class="timer-label" style="color:${timer.isRest?'var(--accent)':'var(--positive)'}">${label}</div>
        <div class="timer-time" style="color:${color}">${display}</div>
        <div class="timer-round">Round ${timer.currentRound} / ${timer.rounds}</div>
      </div>

      <div class="timer-controls">
        ${!timer.running ?
          `<button class="timer-ctrl-btn" style="background:var(--positive);color:#fff" onclick="startTimer()">&#9654;</button>` :
          `<button class="timer-ctrl-btn" style="background:var(--negative);color:#fff" onclick="stopTimer()">&#9724;</button>`
        }
        <button class="timer-ctrl-btn" style="background:var(--surface);color:var(--text)" onclick="resetTimer()">&#8634;</button>
      </div>

      <div class="timer-settings">
        <div class="timer-setting"><label>Rounds</label><div class="val">
          <button class="stepper-btn" onclick="timer.rounds=Math.max(1,timer.rounds-1);renderTimer()">-</button>
          <span>${timer.rounds}</span>
          <button class="stepper-btn" onclick="timer.rounds=Math.min(20,timer.rounds+1);renderTimer()">+</button></div></div>
        <div class="timer-setting"><label>Round Time</label><div class="val">
          <button class="stepper-btn" onclick="timer.roundTime=Math.max(30,timer.roundTime-30);renderTimer()">-</button>
          <span>${Math.floor(timer.roundTime/60)}:${(timer.roundTime%60).toString().padStart(2,'0')}</span>
          <button class="stepper-btn" onclick="timer.roundTime=Math.min(600,timer.roundTime+30);renderTimer()">+</button></div></div>
        <div class="timer-setting"><label>Rest Time</label><div class="val">
          <button class="stepper-btn" onclick="timer.restTime=Math.max(10,timer.restTime-10);renderTimer()">-</button>
          <span>${timer.restTime}s</span>
          <button class="stepper-btn" onclick="timer.restTime=Math.min(300,timer.restTime+10);renderTimer()">+</button></div></div>
      </div>
    </div>`;
}

function startTimer() {
  if (timer.running) return;
  if (timer.currentRound===0) { timer.currentRound=1; timer.timeLeft=timer.roundTime; timer.isRest=false; }
  timer.running=true;
  timer.interval = setInterval(()=>{
    timer.timeLeft--;
    if (timer.timeLeft<=0) {
      if (timer.isRest) {
        timer.currentRound++;
        if (timer.currentRound>timer.rounds) { stopTimer(); showToast('Done! Great work!'); return; }
        timer.isRest=false; timer.timeLeft=timer.roundTime;
        try{navigator.vibrate?.(200);}catch{}
      } else {
        if (timer.currentRound>=timer.rounds) { stopTimer(); showToast('Done! Great work!'); return; }
        timer.isRest=true; timer.timeLeft=timer.restTime;
        try{navigator.vibrate?.([200,100,200]);}catch{}
      }
    }
    renderTimer();
  }, 1000);
  renderTimer();
}

function stopTimer() {
  timer.running=false;
  clearInterval(timer.interval);
  timer.interval=null;
  renderTimer();
}

function resetTimer() {
  stopTimer();
  timer.currentRound=0; timer.timeLeft=0; timer.isRest=false;
  renderTimer();
}

// Direct Anthropic API call (no proxy needed - works on GitHub Pages)
async function callClaude(apiKey, payload) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(payload)
  });
  if (!resp.ok) throw new Error('API error (' + resp.status + ')');
  return await resp.json();
}
